# rl_supermimic: SuperMimic general tracker (supermimic_multi, SUPERMIMIC_ROBOT=t800) on the terminator-teleop
# UDP stream. GENERATED by SCL/Experiments/t800_port/runner_test/make_runner_config.py from the training robot
# spec -- regenerate, do not hand-edit. Checkpoint: t800_nostop_0388000_policy.pt
policy_path: rl_supermimic/policy/policy.mnn
obs_history_length: 10
future_frames: 10
policy_joint_names: [J00_HIP_PITCH_L, J01_HIP_ROLL_L, J02_HIP_YAW_L, J03_KNEE_PITCH_L, J04_ANKLE_PITCH_L, J05_ANKLE_ROLL_L, J06_HIP_PITCH_R, J07_HIP_ROLL_R, J08_HIP_YAW_R, J09_KNEE_PITCH_R, J10_ANKLE_PITCH_R, J11_ANKLE_ROLL_R, J12_TORSO_YAW, J13_SHOULDER_PITCH_L, J14_SHOULDER_ROLL_L, J15_SHOULDER_YAW_L, J16_ELBOW_PITCH_L, J17_ELBOW_YAW_L, J18_SHOULDER_PITCH_R, J19_SHOULDER_ROLL_R, J20_SHOULDER_YAW_R, J21_ELBOW_PITCH_R, J22_ELBOW_YAW_R, J23_HEAD_PITCH, J24_HEAD_YAW]
packet_joint_names: [J00_HIP_PITCH_L, J06_HIP_PITCH_R, J12_TORSO_YAW, J01_HIP_ROLL_L, J07_HIP_ROLL_R, J13_SHOULDER_PITCH_L, J18_SHOULDER_PITCH_R, J23_HEAD_PITCH, J02_HIP_YAW_L, J08_HIP_YAW_R, J14_SHOULDER_ROLL_L, J19_SHOULDER_ROLL_R, J24_HEAD_YAW, J03_KNEE_PITCH_L, J09_KNEE_PITCH_R, J15_SHOULDER_YAW_L, J20_SHOULDER_YAW_R, J04_ANKLE_PITCH_L, J10_ANKLE_PITCH_R, J16_ELBOW_PITCH_L, J21_ELBOW_PITCH_R, J05_ANKLE_ROLL_L, J11_ANKLE_ROLL_R, J17_ELBOW_YAW_L, J22_ELBOW_YAW_R]

# reference stream: deploy/pico_udp_publisher.py --port 47801 (TTP1; --lookahead not needed)
udp_port: 47801
ref_delay_s: 0.2          # 10 future frames x 20 ms: the policy's goal window
ref_sigma_frames: 1.5     # centred Gaussian smoothing of the buffered stream (30 ms)
ref_stale_s: 0.5          # no new pose for this long -> blend to standing
ref_blend_in_s: 1.5
ref_blend_out_s: 1.0
ref_height_calib_s: 1.0   # operator stands still for the first second of streaming
stand_height: 1.0165      # LINK_BASE height, default pose, soles on the floor (training grounding)
entry_blend_s: 2.0        # stand reference moves from the entry pose to the default pose

robot_rot_mode: heading_fixed
imu_ang_vel_world: false  # SDK gyro is body-frame (rl_teleop forensic 2026-09-05)

action_sanity_limit: 20.0  # rad on action_scale * a: garbage detector only (healthy runs reach 4.05 rad on the ankles)
action_clip: 100.0
torque_limit: true
clamp_targets_to_joint_range: false  # training never clamped targets; ankles rely on beyond-range targets
fall_up_z: 0.5
fall_ticks: 25
# entry check: refuse takeover unless both legs are near the stand pose and the base is quiet
entry_check: false  # refusing in Enter() leaves walk torn down on the robot (2026-11-05)
entry_leg_tol: 0.15
entry_gyro_max: 0.5
entry_tilt_max_deg: 10.0
entry_force_refuse: false
# send in-range position targets; the out-of-range part of the PD target goes as feed-forward torque
range_excess_as_torque: true
range_margin: 0.02
# 2026-11-05 robot 4 Hz ankle bounce: one-pole target low-pass (1.0 = off; rl_teleop hardware uses 0.5) and
# observation ankle velocity from the 50 Hz position difference (parallel-ankle converter qd is noisy)
action_lpf_alpha: 1.0
qd_from_q_ankles: false
# one-pole low-pass on the LEG qd observation at 50 Hz (1.0 = off; 0.47 ~ 5 Hz). Robot ankle qd is noisy (2026-11-05)
qd_obs_lpf_alpha: 1.0

