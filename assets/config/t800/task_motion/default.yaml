# ----------------------- Motion Tasks ----------------------- #
cpu:
  number: 3
  priority: 10

tasks:
  - motion: idle
    period: 0.002
    runner:
      - name: idle_runner
        enabled: true
    manual_transition:
      - passive
    auto_transition: passive
    key: [LB, START]

  - motion: passive
    period: 0.002
    runner:
      - name: passive_runner
        enabled: true
    manual_transition:
      - idle
      - pd_stand
      - supine_to_stance
    key: [LB, RB]

  - motion: pd_stand
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand
    manual_transition:
      - passive
      - walk
      - dance
    key: [LB, A]

  - motion: rl_teleop
    period: 0.02
    runner:
      - name: rl_teleop_runner
        enabled: true
        param_tag: rl_teleop
    manual_transition:
      - passive
      - pd_stand
      - walk
    key: [RB, A]

  - motion: walk
    period: 0.01
    runner:
      - name: rl_walking_example_runner
        enabled: true
        param_tag: rl_walking_example
    manual_transition:
      - passive
      - pd_stand
      - stance_to_supine
      - dance
      # rl_teleop is entered from WALK, not pd_stand: the walk controller is
      # a closed-loop balancer, so the handover starts from a genuinely
      # balanced robot. pd_stand is an open-loop pose hold — on the gantry it
      # leans on the strap and hands the policy an off-balance robot
      # (measured 2026-08-31: 8 deg back-lean takeover reproduces the
      # hardware air-stepping).
      - rl_teleop
    key: [LB, B]

  - motion: dance
    period: 0.02
    runner:
      - name: rl_dance_example_runner
        enabled: true
    manual_transition:
      - passive
      - pd_stand
      - walk
    auto_transition: walk
    key: [RB, B]

  - motion: supine_to_stance
    period: 0.01
    runner:
      - name: rl_mimic_trajectory_runner
        enabled: true
        param_tag: rl_supine_to_stance
    manual_transition:
      - passive
    auto_transition: walk
    key: [START, CROSS_X_UP]

  - motion: stance_to_supine
    period: 0.01
    runner:
      - name: rl_mimic_trajectory_runner
        enabled: true
        param_tag: rl_stance_to_supine
    manual_transition:
      - passive
      - pd_stand
    auto_transition: passive
    key: [START, CROSS_X_DOWN]
